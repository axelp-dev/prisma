[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stokes-rpm"
version = "0.1.0"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "argparse"
]

[project.scripts]
prisma = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]